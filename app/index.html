<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EducStat Tete</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app:; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:; font-src 'self' app:">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: barra de menus fixa no topo; cada menu é uma vista; formulários em grelhas largas com rolagem própria. */
/* Paleta: verde da bandeira e do Ministério da Educação, dourado como acento, vermelho só para erros. */
:root {
  --bg: #F3F6F2; --panel: #FFFFFF; --ink: #13221B; --muted: #57695F; --line: #D9E2DB; --soft: #EAF1EB;
  --brand: #0A6B45; --brand-ink: #FFFFFF; --accent: #C98E00; --ok: #1E7A4C; --warn: #A86206; --bad: #C0172F; --sel: #DCEFE3;
  --input: #FFFDF6; --input-line: #C6D2CA;
  --top: linear-gradient(100deg, #043A26, #0A6B45 60%, #0F7E52); --top-ink: #FFFFFF; --side: #FFFFFF; --side-ink: #2A3B33;
  --f-ui: "Public Sans", "Segoe UI", system-ui, sans-serif; --f-display: "Fraunces", Georgia, serif; --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 8px; --side-w: 232px; --top-h: 60px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070D0A; --panel: #101814; --ink: #E1ECE5; --muted: #98AEA2; --line: #24362C; --soft: #17241D; --brand: #3CC48A; --brand-ink: #04130C;
  --accent: #F0B532; --ok: #5CC28E; --warn: #E0A54A; --bad: #F07B72; --sel: #1B3A2B; --input: #16221C; --input-line: #2F453A; --top: #0A1410; --top-ink: #E1ECE5; --side: #0C1511; --side-ink: #C9D8CF; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #070D0A; --panel: #101814; --ink: #E1ECE5; --muted: #98AEA2; --line: #24362C; --soft: #17241D; --brand: #3CC48A; --brand-ink: #04130C;
  --accent: #F0B532; --ok: #5CC28E; --warn: #E0A54A; --bad: #F07B72; --sel: #1B3A2B; --input: #16221C; --input-line: #2F453A; --top: #0A1410; --top-ink: #E1ECE5; --side: #0C1511; --side-ink: #C9D8CF; color-scheme: dark; }

/* Cores dos mapas oficiais (tema claro): EP preto, ESG 1º ciclo verde, ESG 2º ciclo vermelho, Alfabetização/EPJA laranja. No tema escuro ficam só como fio de cor sobre fundo escuro. */
:root { --m-EP: #1F2328; --m-EP-s: #ECEDEF; --m-ESG1: #1B8A3A; --m-ESG1-s: #E5F3E9; --m-ESG2: #C62828; --m-ESG2-s: #FBE9E8; --m-ALFA: #D9731A; --m-ALFA-s: #FCEFE2; --m-ETP: #4A5A9C; --m-ETP-s: #EAEDF7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --m-EP: #9AA4AE; --m-EP-s: #15181B; --m-ESG1: #4CC27A; --m-ESG1-s: #0F1A13; --m-ESG2: #F06A62; --m-ESG2-s: #1C1111; --m-ALFA: #F0A35A; --m-ALFA-s: #1C150D; --m-ETP: #8C9BE0; --m-ETP-s: #12141D; } }
:root[data-theme="dark"] { --m-EP: #9AA4AE; --m-EP-s: #15181B; --m-ESG1: #4CC27A; --m-ESG1-s: #0F1A13; --m-ESG2: #F06A62; --m-ESG2-s: #1C1111; --m-ALFA: #F0A35A; --m-ALFA-s: #1C150D; --m-ETP: #8C9BE0; --m-ETP-s: #12141D; }
[data-mapa="EP"] { --m: var(--m-EP); --ms: var(--m-EP-s); } [data-mapa="ESG1"] { --m: var(--m-ESG1); --ms: var(--m-ESG1-s); } [data-mapa="ESG2"] { --m: var(--m-ESG2); --ms: var(--m-ESG2-s); } [data-mapa="ALFA"] { --m: var(--m-ALFA); --ms: var(--m-ALFA-s); } [data-mapa="ETP"] { --m: var(--m-ETP); --ms: var(--m-ETP-s); }
.mapa { border: 1px solid color-mix(in srgb, var(--m) 45%, var(--line)); border-top: 4px solid var(--m); border-radius: var(--r); padding: 10px; background: linear-gradient(var(--ms), var(--panel) 120px); }
.mapa > h3, .mapa h3.mt { color: var(--m); text-transform: uppercase; letter-spacing: .04em; font-size: 12.5px; }
.mapa table.ed th { background: color-mix(in srgb, var(--m) 14%, var(--soft)); color: var(--ink); border-bottom-color: color-mix(in srgb, var(--m) 40%, var(--line)); }
.mapa tfoot td { background: color-mix(in srgb, var(--m) 10%, var(--soft)); }
tr[data-mapa] > td:first-child { box-shadow: inset 4px 0 0 var(--m); }
.qref { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: 8px; vertical-align: middle; }
.qref span { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; color: var(--panel); background: var(--m); text-transform: none; }
.legend-mapas { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend-mapas i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--m); margin-right: 5px; vertical-align: -1px; }
/* acabamento moderno */
.kpis.hero .kpi { background: linear-gradient(160deg, color-mix(in srgb, var(--brand) 7%, var(--panel)), var(--panel) 60%); }
.kpis.hero .kpi .d { display: flex; align-items: center; gap: 6px; }
.card { box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 1px rgba(16,24,40,.03); }
.kpi { position: relative; overflow: hidden; }
.kpi::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: linear-gradient(90deg, var(--brand), var(--accent)); opacity: .55; }
.btn, .tabs button, nav.menu a { transition: background .15s, color .15s, box-shadow .15s; }

/* antes de entrar: só o painel de início de sessão */
body.sem-sessao .top, body.sem-sessao::before { display: none; }
body.sem-sessao main { min-height: 100vh; justify-content: center; background: radial-gradient(1200px 600px at 20% -10%, color-mix(in srgb, var(--brand) 18%, transparent), transparent), var(--bg); }
.login { box-shadow: 0 30px 80px -40px rgba(0,0,0,.45); border-top: 5px solid var(--brand); }
/* menu interno */
.conta { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: inherit; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); border-radius: 999px; padding: 3px 10px 3px 3px; cursor: pointer; text-align: left; }
.conta .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
.conta b { display: block; font-size: 12.5px; line-height: 1.1; } .conta small { display: block; font-size: 11px; opacity: .8; }
.menu-app { position: fixed; z-index: 60; width: 17rem; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); padding: 6px; display: flex; flex-direction: column; }
.menu-app .mg { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 2px; }
.menu-app button { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; text-align: left; }
.menu-app button:hover { background: var(--soft); }
.menu-app kbd { font: 11px var(--f-mono); color: var(--muted); }
/* quadro 1: faixa do turno */
table.ed tr.faixa-turno td { background: color-mix(in srgb, var(--m, var(--brand)) 12%, var(--panel)); font-weight: 700; color: var(--m, var(--brand)); text-transform: uppercase; letter-spacing: .05em; font-size: 11.5px; padding: 4px 8px; }
table.ed tr.faixa-turno td span { margin-right: 12px; }
table.ed td.cl { white-space: nowrap; } table.ed td.cl span { color: var(--muted); margin-left: 2px; }
/* publicações */
.pub-prev { display: flex; justify-content: center; }
.pub-frame { width: min(100%, 900px); height: 80vh; border: 1px solid var(--line); border-radius: var(--r); background: #fff; box-shadow: 0 10px 30px -18px rgba(0,0,0,.4); }
/* v1.2: separadores de mapas, notas (i), ícones do topo, janelas flutuantes */
.mapas-seg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
.mapas-seg button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
.mapas-seg button .mk { width: 12px; height: 12px; border-radius: 3px; background: var(--m); }
.mapas-seg button[aria-selected="true"] { background: var(--m); color: #fff; border-color: var(--m); box-shadow: 0 2px 10px -4px var(--m); }
.mapas-seg button[aria-selected="true"] .mk { background: #fff; }
:root[data-theme="dark"] .mapas-seg button[aria-selected="true"] { background: var(--ms); color: var(--m); box-shadow: inset 0 0 0 1px var(--m); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mapas-seg button[aria-selected="true"] { background: var(--ms); color: var(--m); box-shadow: inset 0 0 0 1px var(--m); } }
.add-mapa { font-size: 13px; }
.tabs[data-mapa] button[aria-selected="true"] { border-bottom-color: var(--m); }
.info { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--m, var(--brand)); color: var(--panel); font: italic 700 12px/1 Georgia, serif; text-transform: none; margin-left: 8px; cursor: help; position: relative; vertical-align: middle; letter-spacing: 0; }
.info:hover::after, .info:focus::after { content: attr(data-tip); position: absolute; left: 0; top: 24px; z-index: 30; width: min(30rem, 80vw); white-space: pre-line; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--m, var(--brand)); border-radius: var(--r); padding: 10px 12px; font: 400 12.5px/1.5 var(--f-ui); box-shadow: 0 10px 30px -10px rgba(0,0,0,.35); text-align: left; }
.icones { display: flex; gap: 6px; align-items: center; }
.ib { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid color-mix(in srgb, currentColor 35%, transparent); background: transparent; color: inherit; cursor: pointer; }
.ib:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
.ib .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #E5484D; color: #fff; font: 700 11px/18px var(--f-ui); text-align: center; box-shadow: 0 0 0 2px var(--brand); }
#ib-online .badge { background: #2FB36B; }
.ib.pulse { animation: pulso 1.6s ease-in-out infinite; }
@keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,.6); } 50% { box-shadow: 0 0 0 8px rgba(229,72,77,0); } }
@media (prefers-reduced-motion: reduce) { .ib.pulse { animation: none; } }
.pop { position: fixed; top: 70px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(34rem, calc(100vw - 32px)); max-height: calc(100vh - 90px); overflow: auto; z-index: 45; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); }
.pop-in { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg-list { display: flex; flex-direction: column; gap: 6px; }
.msg { border-left: 3px solid var(--line); padding: 4px 10px; }
.conversa { border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.msg.resposta { margin-left: 18px; border-left-color: var(--accent); }
.msg.citada { background: var(--soft); border-left-color: var(--brand); }
.msg.nova { border-left-color: #E5484D; background: color-mix(in srgb, #E5484D 7%, transparent); }
.dot-on { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2FB36B; margin-right: 6px; box-shadow: 0 0 0 3px color-mix(in srgb, #2FB36B 25%, transparent); }
.ind-nome { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.spk { border: 0; background: transparent; padding: 2px; cursor: pointer; border-radius: 4px; flex: none; }
.spk:hover { background: var(--soft); }
.def-graf { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; color: var(--muted); font-size: 11px; }

/* v1.4: cabeçalho fino, faixa com as cores da bandeira, barra lateral com ícones que se recolhe (botão ☰) */
.top { height: auto; }
.top-in { max-width: none; gap: 14px; min-height: var(--top-h); flex-wrap: nowrap; }
.hamb { width: 38px; height: 38px; border-radius: 10px; border: 0; background: color-mix(in srgb, currentColor 12%, transparent); color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.hamb:hover { background: color-mix(in srgb, currentColor 22%, transparent); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-ui); min-width: 0; }
.brand img { width: 36px; height: 36px; flex: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
.brand b { display: block; font-family: var(--f-display); font-size: 19px; font-weight: 600; line-height: 1.1; }
.brand small { display: block; margin: 0; font-size: 10.5px; letter-spacing: .07em; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-sp { flex: 1; }
.faixa { display: grid; grid-template-columns: 6fr 1fr 2fr 1fr; height: 4px; }
.faixa i:nth-child(1) { background: #009A44; } .faixa i:nth-child(2) { background: #111; } .faixa i:nth-child(3) { background: #FCD116; } .faixa i:nth-child(4) { background: #D21034; }
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--top-h) - 4px); transition: grid-template-columns .18s; }
body.nav-mini .shell { grid-template-columns: 66px minmax(0, 1fr); }
nav.side { position: sticky; top: calc(var(--top-h) + 4px); align-self: start; height: calc(100vh - var(--top-h) - 4px); overflow: auto; background: var(--side); color: var(--side-ink); border-right: 1px solid var(--line); padding: 12px 10px 20px; display: flex; flex-direction: column; gap: 2px; flex-wrap: nowrap; }
nav.side .grp { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; white-space: nowrap; }
nav.side a[hidden] { display: none; }
nav.side a { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; color: inherit; text-decoration: none; font-weight: 500; font-size: 14px; opacity: 1; white-space: nowrap; position: relative; }
nav.side a { min-height: 40px; }
nav.side a svg { width: 20px; height: 20px; flex: 0 0 20px; margin: 0; stroke: currentColor; }
nav.side a:hover { background: var(--soft); }
nav.side a[aria-current="page"] { background: color-mix(in srgb, var(--brand) 13%, var(--panel)); color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); font-weight: 650; }
nav.side a .nb { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: #E5484D; color: #fff; font: 700 11px/20px var(--f-ui); text-align: center; padding: 0 5px; }
nav.side a .nb:empty { display: none; }
nav.side .grp + a { margin-top: 1px; }
body.nav-mini nav.side .grp { visibility: hidden; height: 14px; padding: 0; }
body.nav-mini nav.side a { justify-content: center; padding: 10px 0; }
body.nav-mini nav.side a span { display: none; }
body.nav-mini nav.side a .nb { position: absolute; top: 2px; right: 6px; margin: 0; min-width: 16px; height: 16px; line-height: 16px; font-size: 10px; }
nav.side .side-pe { margin-top: auto; padding: 14px 10px 0; font-size: 11px; color: var(--muted); line-height: 1.4; white-space: normal; }
body.nav-mini nav.side .side-pe { display: none; }
.shell > main { max-width: 1480px; width: 100%; }
.tw, .table-scroll, .scroll-y { max-height: 68vh; overflow: auto; overscroll-behavior: contain; }
.tw thead th, table.ed thead th { position: sticky; top: 0; z-index: 2; }
body.sem-sessao .shell { display: block; } body.sem-sessao nav.side, body.sem-sessao .faixa { display: none; }
@media (max-width: 900px) {
  .shell, body.nav-mini .shell { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: fixed; z-index: 35; left: 0; top: calc(var(--top-h) + 4px); width: min(80vw, 260px); transform: translateX(-105%); transition: transform .2s; box-shadow: 0 20px 60px -20px rgba(0,0,0,.5); }
  body.nav-open nav.side { transform: none; }
  body.nav-mini nav.side a span { display: inline; } body.nav-mini nav.side a { justify-content: flex-start; padding: 9px 10px; }
  .brand small { display: none; }
}
/* cartão do utilizador e painel da conta */
.conta { border-radius: 12px; padding: 4px 10px 4px 4px; }
.conta .av { width: 32px; height: 32px; font-size: 13px; background: linear-gradient(135deg, var(--accent), #E8B931); color: #2B1D00; }
.menu-app { width: 19rem; padding: 8px; border-radius: 14px; }
.menu-app .cab { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 14%, var(--panel)), var(--panel)); margin-bottom: 4px; }
.menu-app .cab .av { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #E8B931); color: #2B1D00; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex: none; }
.menu-app .cab b { display: block; font-size: 14px; } .menu-app .cab small { display: block; font-size: 12px; color: var(--muted); }
.menu-app button svg { width: 17px; height: 17px; stroke: currentColor; flex: none; opacity: .8; }
.menu-app button .t { display: flex; align-items: center; gap: 10px; }
.menu-app button.perigo { color: var(--bad); }
/* datas e prazos legíveis */
.prazo-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 10px; }
.prazo { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--panel); border-left: 5px solid var(--ok); }
.prazo.fechado { border-left-color: var(--bad); } .prazo.harm { border-left-color: var(--brand); } .prazo.quase { border-left-color: var(--warn); }
.prazo .q { font-size: 12px; color: var(--muted); } .prazo .e { font-weight: 700; font-size: 15px; } .prazo .d { font-size: 12.5px; }
/* lista longa com indicação de que continua */
.rolagem { max-height: 520px; overflow: auto; position: relative; padding-right: 4px; scrollbar-gutter: stable; }
.rolagem-pe { position: sticky; bottom: 0; display: flex; justify-content: center; padding: 18px 0 2px; background: linear-gradient(transparent, var(--panel) 55%); pointer-events: none; }
.rolagem-pe span { pointer-events: auto; font-size: 12px; font-weight: 600; color: var(--brand); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; box-shadow: 0 4px 14px -8px rgba(0,0,0,.3); cursor: pointer; }
.rolagem.fim .rolagem-pe { display: none; }
.rolagem .ilist { grid-template-columns: minmax(11rem, 1fr) auto auto auto; }
.rolagem .ind-nome small { max-width: 26ch; }
/* mensagens: área própria */
.msg-shell { display: grid; grid-template-columns: minmax(15rem, 20rem) minmax(0, 1fr); gap: 14px; min-height: 60vh; }
@media (max-width: 900px) { .msg-shell { grid-template-columns: minmax(0, 1fr); } }
.msg-side { display: flex; flex-direction: column; gap: 10px; }
.msg-side .lista { display: flex; flex-direction: column; gap: 2px; overflow: auto; max-height: 62vh; }
.conv-it { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.conv-it:hover { background: var(--soft); } .conv-it[aria-current="true"] { background: color-mix(in srgb, var(--brand) 12%, var(--panel)); }
.conv-it .av { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; background: var(--soft); color: var(--brand); flex: none; position: relative; }
.conv-it .av.on::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: #2FB36B; box-shadow: 0 0 0 2px var(--panel); }
.conv-it .tx { min-width: 0; flex: 1; } .conv-it .tx b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-it .tx small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-it .nb { min-width: 18px; height: 18px; border-radius: 9px; background: #E5484D; color: #fff; font: 700 10.5px/18px var(--f-ui); text-align: center; padding: 0 4px; }
.chat { display: flex; flex-direction: column; min-height: 60vh; }
.chat-cab { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.chat-fio { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 2px; max-height: 56vh; }
.bolha { max-width: 75%; padding: 8px 12px; border-radius: 14px; background: var(--soft); align-self: flex-start; white-space: pre-wrap; line-height: 1.45; }
.bolha.minha { align-self: flex-end; background: color-mix(in srgb, var(--brand) 16%, var(--panel)); }
.bolha small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.bolha .pend { color: var(--warn); }
.dia { align-self: center; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.chat-esc { display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--line); padding-top: 10px; }
.chat-esc textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 160px; font: inherit; padding: 9px 10px; border: 1px solid var(--input-line); border-radius: 10px; background: var(--input); color: var(--ink); }
.pessoa { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; }
.pessoa:hover { background: var(--soft); }
.pessoa .tx { flex: 1; min-width: 0; } .pessoa .tx b { display: block; font-size: 13px; } .pessoa .tx small { display: block; font-size: 11.5px; color: var(--muted); }
/* visita guiada */
.tour-vel { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
.tour-foco { position: fixed; z-index: 81; border-radius: 12px; box-shadow: 0 0 0 4px var(--accent), 0 0 0 9999px rgba(4,20,12,.62); transition: all .25s; pointer-events: none; }
.tour-caixa { position: fixed; z-index: 82; width: min(24rem, calc(100vw - 32px)); background: var(--panel); color: var(--ink); border-radius: 14px; padding: 16px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--accent); }

.tour-caixa .pt { display: flex; gap: 5px; } .tour-caixa .pt i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); } .tour-caixa .pt i.on { background: var(--accent); }
.tour-seta { position: fixed; z-index: 82; width: 0; height: 0; border: 10px solid transparent; }
/* ajuda */
.ajuda-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 12px; }
.ajuda-c { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
.ajuda-c::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c, var(--brand)); }
.ajuda-c .ic { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c, var(--brand)) 14%, var(--panel)); color: var(--c, var(--brand)); }
.ajuda-c .ic svg { width: 22px; height: 22px; stroke: currentColor; }
.ajuda-c h3 { font-size: 15px; } .ajuda-c p, .ajuda-c li { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink); }
.ajuda-c ol, .ajuda-c ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.passos { counter-reset: p; display: flex; flex-direction: column; gap: 10px; }
.passo { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.passo::before { counter-increment: p; content: counter(p); width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.passo b { display: block; margin-bottom: 2px; } .passo p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.ficha-ind { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap: 10px; }
.ficha-ind .fi { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 5px; scroll-margin-top: 90px; }
.ficha-ind .fi:target { box-shadow: 0 0 0 3px var(--accent); }
.ficha-ind .fi b { font-size: 14px; } .ficha-ind .fi .fx { font: 12.5px var(--f-mono); background: var(--soft); border-radius: 6px; padding: 6px 8px; color: var(--ink); }
.ficha-ind .fi .tg { display: flex; gap: 6px; flex-wrap: wrap; }
.ficha-ind .fi .tg span { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.grupo-t { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--brand); margin: 8px 0 0; }
/* lançar: distritos que não são do utilizador */
option.alheio { color: #8A9590; }
select.alheio { color: var(--muted); font-style: italic; }
.autosave { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--top, var(--brand)); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--top, var(--brand)); color: var(--top-ink, var(--brand-ink)); box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 6px 18px -12px rgba(0,0,0,.35); }
.top-in { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1480px; margin: 0 auto; }
.who { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 8px; }
.who img { width: 24px; height: 24px; border-radius: 50%; }
.who button { background: transparent; border: 1px solid color-mix(in srgb, currentColor 40%, transparent); color: inherit; border-radius: var(--r); padding: 3px 9px; cursor: pointer; font-size: 12px; }
.login { max-width: 26rem; margin: 8vh auto 0; }
.login h1 { font-size: 30px; }
main { max-width: 1480px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 26px; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 600; margin: 0; }
h3 { font-size: 14px; font-weight: 600; margin: 0; }
.lede { color: var(--muted); margin: 0; max-width: 80ch; line-height: 1.5; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.row.between { justify-content: space-between; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f select, label.f input { min-width: 9rem; }
select, input[type=text], input[type=search], input[type=number], input[type=password], input[type=email], input[type=date] { background: var(--input); border: 1px solid var(--input-line); border-radius: var(--r); padding: 6px 8px; color: var(--ink); }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 7px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.warn { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 7px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--soft); color: var(--muted); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.mono { font-family: var(--f-mono); }
.tw { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); max-width: 100%; }
.tw.tall { max-height: 560px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--soft); font-size: 11px; font-weight: 600; color: var(--muted); z-index: 1; }
th:first-child, td:first-child { text-align: left; }
td.l, th.l { text-align: left; }
tfoot td { font-weight: 600; background: var(--soft); position: sticky; bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--sel) 50%, transparent); }
table.ed input[type=number] { width: 4.6rem; padding: 3px 5px; text-align: right; font-family: var(--f-mono); font-size: 13px; }
table.ed input[type=number].w3 { width: 3.4rem; }
table.ed select { padding: 3px 5px; max-width: 16rem; }
table.ed td { padding: 3px 4px; }
table.ed td.calc { color: var(--muted); font-family: var(--f-mono); font-size: 13px; background: var(--soft); }
table.ed tr.err td { background: color-mix(in srgb, var(--bad) 10%, transparent); }
table.ed th.grp { text-align: center; border-left: 1px solid var(--line); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.good { color: var(--ok); } .badc { color: var(--bad); }
.bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--brand); }
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.issues { margin: 0; padding: 0; list-style: none; font-size: 13px; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow: auto; }
.issues:empty { display: none; }
.issues .iss-cab { padding: 6px 10px; background: var(--soft); border-radius: var(--r); position: sticky; top: 0; z-index: 1; }
.issues .iss { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-left: 4px solid; border-radius: 4px; }
.issues .iss.erro { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, transparent); }
.issues .iss.aviso { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 7%, transparent); }
.issues .iss > span:nth-child(2) { flex: 1; }
.issues .iss-g { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; min-width: 3.6rem; }
.issues .erro .iss-g { color: var(--bad); } .issues .aviso .iss-g { color: var(--warn); }
.chart { position: relative; width: 100%; min-height: 240px; }
.chart svg text { fill: var(--muted); font-size: 11px; font-family: var(--f-ui); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; z-index: 3; }
.ilist { display: grid; grid-template-columns: minmax(0,1fr) auto auto auto; column-gap: 14px; font-variant-numeric: tabular-nums; }
.ilist > div { padding: 6px 0; border-bottom: 1px solid var(--line); }
.ilist .h { font-size: 11px; color: var(--muted); font-weight: 600; }
.ilist .g { grid-column: 1/-1; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--brand); padding-top: 12px; }
.ilist .n { text-align: right; min-width: 5.5rem; }
.ilist small { display: block; color: var(--muted); font-size: 11px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r); z-index: 50; max-width: min(90vw, 28rem); }
.modal { position: fixed; inset: 0; background: rgba(10,20,22,.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal > div { background: var(--panel); border-radius: var(--r); padding: 18px; max-width: 30rem; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.prog { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.help p, .help li { line-height: 1.55; max-width: 85ch; }
.help h2 { margin-top: 10px; }
main a { color: var(--brand); }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; }
@media (max-width: 700px) { .hide-sm { display: none; } .kpi .v { font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

table.ordenavel th[aria-sort] button.ord .seta { color: var(--brand); }
.login-versao { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); text-align: center; font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.ib.gira svg { animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
ol.base-passos { margin: 6px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
ol.base-passos li { line-height: 1.5; } ol.base-passos .pill { margin-left: 4px; }
.shp-prev svg { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; display: block; }
.exec { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 10px; }
.exec .k { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--panel); display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.exec .k:hover { border-color: var(--brand); box-shadow: 0 6px 20px -14px rgba(0,0,0,.4); }
.exec .k .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.exec .k .v { font: 600 28px/1.1 var(--f-display); }
.exec .k .s { font-size: 12.5px; color: var(--muted); }
.barra { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; } .barra > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.ciclo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; } .ciclo span { font-size: 11px; text-align: center; padding: 3px 2px; border-radius: 6px; background: var(--soft); color: var(--muted); } .ciclo span.on { background: var(--brand); color: #fff; font-weight: 600; } .ciclo span.at { outline: 2px solid var(--accent); }
.sev-erro { color: var(--bad); font-weight: 700; } .sev-aviso { color: var(--warn); font-weight: 700; } .sev-anomalia { color: #2E6F8E; font-weight: 700; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.login-abas{align-self:stretch;display:flex}.login-abas button{flex:1}

a.lig{color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}a.lig:hover{color:var(--accent)}

.pop-tema{display:flex;flex-direction:column;gap:10px;min-width:16rem}.pop-tema .sw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pop-tema .sw button{border:2px solid transparent;border-radius:10px;padding:8px 4px;background:var(--soft);cursor:pointer;font:600 12px var(--f-ui);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.pop-tema .sw button[aria-pressed=true]{border-color:var(--brand)}.pop-tema .sw i{width:28px;height:14px;border-radius:7px;display:block}
.cfg-novo{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--soft)}.cfg-novo summary{cursor:pointer;font-weight:600;color:var(--brand)}.cfg-novo-c{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.emo-pop{position:absolute;bottom:100%;right:60px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:5}.emo-pop button{border:0;background:transparent;font-size:20px;cursor:pointer;border-radius:6px;padding:4px}.emo-pop button:hover{background:var(--soft)}
/* 1.16: acessibilidade, foco visível, qualidade e leitura em ecrãs pequenos */
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button, input, select, textarea { font: inherit; }
button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .62; }
.quality-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 8px; margin: 10px 0; }
.quality-kpi { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; background: var(--soft); display: flex; flex-direction: column; gap: 3px; }
.quality-kpi b { font: 700 1.45rem var(--f-mono); color: var(--brand); }
.quality-kpi span { color: var(--muted); font-size: 12px; }
@media (max-width: 760px) { :root { --side-w: 62px; } .side-label { display: none; } .quality-grid { grid-template-columns: repeat(2, 1fr); } .row { flex-wrap: wrap; } }
@media (prefers-contrast: more) { :root { --line: #5B6B62; } .btn, .tabs button, input, select, textarea { border-width: 2px; } }

.emis-grupo{margin:12px 0 4px;border-top:2px solid var(--gc);padding-top:6px}
.emis-h{margin:4px 0 8px;color:var(--gc);font-size:13px;letter-spacing:.02em}
.emis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.emis-tile{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--gc);border-radius:10px;padding:10px 12px}
.emis-v{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.emis-l{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.25}

/* mapas interactivos */
.mapa-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(220px,1fr);gap:16px;align-items:start}
@media (max-width:860px){.mapa-grid{grid-template-columns:1fr}}
.mapa-box{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapa-box svg{display:block}
.mapa-box [data-cod]{transition:stroke-width .08s}
.mapa-tip{background:var(--ink,#13221B);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap}
.mapa-lado h3{margin:0 0 4px;font-size:14px}
.mapa-leg{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.mapa-rank{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;max-height:320px;overflow:auto;font-variant-numeric:tabular-nums}
.mapa-rank-l{padding:3px 6px;border-radius:6px}
.mapa-rank-l:hover{background:var(--soft)}
.mapa-rank-l.foco{background:var(--gc,#DCEFE3);outline:2px solid var(--brand,#0A6B45)}
.esc-pt{transition:r .08s}.esc-pt:hover{r:4.5}
